services:
  mile:
    image: ghcr.io/mile-garage/mile:latest
    # build: .   # uncomment to build from source
    container_name: mile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Rome
      # MILE_BASE_URL: https://mile.example.com   # links in notifications
      # Email notifications (ntfy needs no server settings):
      # MILE_SMTP_HOST: smtp.example.com
      # MILE_SMTP_USERNAME: mile@example.com
      # MILE_SMTP_PASSWORD: change-me
      # MILE_SMTP_FROM: MILE <mile@example.com>
      # Login with Authentik or another OpenID Connect provider (needs MILE_BASE_URL):
      # MILE_OIDC_ISSUER: https://auth.example.com/application/o/mile/
      # MILE_OIDC_CLIENT_ID: change-me
      # MILE_OIDC_CLIENT_SECRET: change-me
      # MILE_OIDC_NAME: Authentik
    volumes:
      - mile-data:/data
    # With a host path (e.g. a TrueNAS dataset) run as the user that owns it:
    # user: "568:568"
    # volumes:
    #   - /mnt/tank/apps/mile:/data

volumes:
  mile-data:
